<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FORGE — Survival Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    /* Let Phaser's ScaleManager handle centering via margin — no flex interference */
    #game-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    /* Portrait-mode overlay */
    #rotate-msg {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      font-size: 20px;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
    }
    #rotate-msg span { font-size: 56px; }
    @media screen and (orientation: portrait) and (pointer: coarse) {
      #rotate-msg { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-msg">
    <span>&#x21BB;</span>
    Please rotate your device to landscape to play FORGE
  </div>
  <div id="game-container"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
